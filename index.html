<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tapwell School</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: graph-paper ground, one centred column. Home = semester shelves of module cards; module = tests; test = topic plan + study-mode tabs. */
:root{
  --paper:#F2F5F8; --sheet:#FFFFFF; --grid:rgba(36,83,214,.07); --ink:#16202F; --muted:#5A6577;
  --line:#D6DEE8; --accent:#2453D6; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB; --demand:#C24E1A; --mint:#12A57C;
  --good:#1E7A4C; --good-soft:#E1F3E9; --bad:#B42336; --bad-soft:#FBE6E9; --flag:#A86A00; --flag-soft:#FBF0DA;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10151E; --sheet:#171E2A; --grid:rgba(120,155,255,.06); --ink:#E6ECF4; --muted:#97A3B6;
  --line:#2A3445; --accent:#7EA2FF; --accent-ink:#0E1320; --accent-soft:#1D2A4A; --demand:#F08A55; --mint:#3FDDB0;
  --good:#5BC98D; --good-soft:#15301F; --bad:#FF7A8A; --bad-soft:#3A1820; --flag:#F2B544; --flag-soft:#33280F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151E; --sheet:#171E2A; --grid:rgba(120,155,255,.06); --ink:#E6ECF4; --muted:#97A3B6;
  --line:#2A3445; --accent:#7EA2FF; --accent-ink:#0E1320; --accent-soft:#1D2A4A; --demand:#F08A55; --mint:#3FDDB0;
  --good:#5BC98D; --good-soft:#15301F; --bad:#FF7A8A; --bad-soft:#3A1820; --flag:#F2B544; --flag-soft:#33280F; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em}
h2{font-size:21px;font-weight:700}
h3{font-size:16.5px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font-family:var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand .dot{color:var(--mint)}
.brand small{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.crumbs{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}

/* generic */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--ink)}
.chip strong{color:var(--accent)}
.btn{font:600 14.5px var(--body);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

/* home */
.hero{display:flex;flex-direction:column;gap:8px}
.upnext{display:flex;flex-direction:column;gap:8px}
.un{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.un:hover{border-color:var(--accent)}
.un .when{font-family:var(--mono);font-size:12px;line-height:1.3;color:var(--muted)}
.un .when b{display:block;font-size:20px;color:var(--ink);font-family:var(--display)}
.un .what{min-width:0}
.un .what span{display:block;color:var(--muted);font-size:13.5px}
.pill{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.soon{background:var(--bad-soft);color:var(--bad)}
.pill.later{background:var(--line);color:var(--muted)}
.shelf{display:flex;flex-direction:column;gap:12px}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--line);padding-bottom:6px}
.shelf-head button{background:none;border:0;color:var(--muted);cursor:pointer;font:500 13px var(--body);padding:0}
.shelf.now .shelf-head{border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none;color:var(--ink);min-width:0;min-height:128px}
.mod:hover{border-color:var(--accent)}
.mod .code{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.mod h3{font-size:16px}
.mod .foot{margin-top:auto;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.mod .foot .live{color:var(--mint);font-weight:600}
.mod.empty{background:transparent;border-style:dashed}
.mod.empty h3{color:var(--muted)}

/* module page */
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.test{display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px;text-decoration:none;color:var(--ink)}
.test:hover{border-color:var(--accent)}
.test .meta{font-size:13.5px;color:var(--muted)}
.emptystate{border:1.5px dashed var(--line);border-radius:10px;padding:28px 22px;display:flex;flex-direction:column;gap:8px;max-width:60ch}

/* test page: topic plan */
.plan{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--sheet);overflow:hidden}
.pt{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:13px 16px;border-top:1px solid var(--line);align-items:center}
.pt:first-child{border-top:0}
.pt .why{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.pt h3{font-size:15px}
.tech{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.tbtn{font:600 12.5px var(--body);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.tbtn:first-child{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* mode tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{font:600 14.5px var(--body);background:none;border:0;color:var(--muted);padding:10px 13px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qtopic{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--demand)}
.qtext{font-size:17px;font-weight:500;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:15px/1.45 var(--body);color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--muted);min-width:1.2em}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.explain{padding:12px 14px;border-left:3px solid var(--good);background:var(--good-soft);border-radius:0 6px 6px 0;font-size:14.5px}
.explain.miss{border-left-color:var(--bad);background:var(--bad-soft)}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.qn{font:600 12px var(--mono);height:32px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.qn.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.qn.cur{outline:2px solid var(--accent);outline-offset:1px}
.qn.flag{border-color:var(--flag);color:var(--flag)}
.score{font-family:var(--display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tbars{display:flex;flex-direction:column;gap:8px}
.tb{display:grid;grid-template-columns:170px 1fr 56px;gap:10px;align-items:center;font-size:13.5px}
.tb .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.tb .track i{display:block;height:100%}
.tb .v{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.rv{border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.rv .yours{color:var(--bad)} .rv .ans{color:var(--good);font-weight:600}

/* topic filter */
.filter{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font:500 13px var(--body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.tchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tchip .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}

/* flashcards */
.card{min-height:210px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:28px 22px;cursor:pointer;width:100%;color:var(--ink);font:inherit}
.card .front{font-family:var(--display);font-size:clamp(19px,4vw,24px);font-weight:700;text-wrap:balance}
.card .back{font-size:16px;max-width:52ch}
.card.flipped{border-color:var(--accent)}
.boxes{display:flex;gap:6px;align-items:flex-end}
.boxes span{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.boxes i{display:block;width:26px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}

/* calc */
.calc-q{display:flex;flex-direction:column;gap:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:5px 10px;text-align:right;font-family:var(--mono)}
th:first-child,td:first-child{text-align:left;font-family:var(--body);font-weight:600}
td.ask{background:var(--flag-soft);color:var(--flag);font-weight:700}
.ansrow{display:flex;gap:8px;flex-wrap:wrap}
.ansrow input{font:600 16px var(--mono);padding:9px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);width:180px;max-width:100%}
.working{font-family:var(--mono);font-size:13.5px;line-height:1.7;background:var(--accent-soft);padding:10px 14px;border-radius:6px;overflow-x:auto}
.streak{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* written */
.wq{display:flex;flex-direction:column;gap:10px}
.src{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.points{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.points label{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer;padding:7px 10px;border-radius:6px;border:1px solid var(--line)}
.points input{margin-top:4px;accent-color:var(--accent)}
textarea{font:15px/1.5 var(--body);width:100%;min-height:150px;padding:12px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);resize:vertical}

/* notes */
details.note{background:var(--sheet);border:1px solid var(--line);border-radius:10px}
details.note summary{cursor:pointer;padding:14px 18px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.note summary::-webkit-details-marker{display:none}
details.note summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:18px}
details.note[open] summary::after{content:"–"}
.nb{padding:0 18px 18px;font-size:14.5px;max-width:68ch;display:flex;flex-direction:column;gap:10px}
.nb ul{margin:0;padding-left:20px}
.nb li{margin:3px 0}
.nb .k{font-weight:600}
.formula{font-family:var(--mono);font-size:13.5px;background:var(--accent-soft);padding:8px 12px;border-radius:6px;overflow-x:auto;white-space:pre}
.trap{border-left:3px solid var(--demand);padding:6px 12px;font-size:14px}
.trap b{color:var(--demand)}
footer{font-size:12.5px;color:var(--muted);text-align:center;margin-top:20px}

@media (max-width:560px){
  .sheet{padding:16px}
  .tb{grid-template-columns:110px 1fr 48px}
  .pt{grid-template-columns:1fr}
  .tech{justify-content:flex-start}
  .un{grid-template-columns:62px 1fr}
  .un .pill{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><a class="brand" href="#home">tapwell<span class="dot">.</span><small>school</small></a></div>
  <p class="muted">Loading your modules…</p>
</div>
<script src="app.js"></script>
</body>
</html>
